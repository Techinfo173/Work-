<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Gemini</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400&family=Inter:wght@300;400&display=swap');

        :root {
            --bg-page: #02080a;
            --pill-top:    #1c3d38;
            --pill-mid:    #0f2a26;
            --pill-bottom: #04100e;
            --text-color: #f0faf8;
            --icon-color: #f4fbf9;
            --glow-core: #d4fbf0;
            --glow-mid:  #4ee0c8;
            --glow-deep: #128878;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-page);
            font-family: 'Google Sans', 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
        }

        /* Background ambient glow */
        body::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 800px;
            height: 300px;
            transform: translate(-50%, 20%);
            background: radial-gradient(ellipse at center,
                rgba(30, 160, 140, 0.12) 0%,
                transparent 65%);
            filter: blur(30px);
            pointer-events: none;
        }

        /* Canvas for background sparkle field */
        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .pill-wrapper {
            position: relative;
            width: 560px;
            height: 100px;
            border-radius: 999px;
            background: linear-gradient(180deg,
                var(--pill-top)    0%,
                var(--pill-mid)   45%,
                var(--pill-bottom) 100%);
            box-shadow:
                0 28px 55px rgba(0,0,0,0.9),
                0  8px 20px rgba(0,0,0,0.6),
                0  0  50px rgba(30,160,140,0.07),
                inset 0  1px 0 rgba(160,240,210,0.15),
                inset 0 -6px 16px rgba(0,0,0,0.5);
            overflow: hidden;
            z-index: 1;
        }

        /* Canvas for the Gemini sparkle ring on the pill */
        #pill-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Inner rim glow */
        .pill-rim {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            box-shadow:
                inset 0 0 24px rgba(60,210,185,0.20),
                inset 0 0 60px rgba(35,150,135,0.10);
            pointer-events: none;
            z-index: 2;
        }

        /* Subtle top gloss */
        .pill-gloss {
            position: absolute;
            top: 0; left: 4%; right: 4%;
            height: 38%;
            border-radius: 999px 999px 60% 60%;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.045) 0%,
                transparent 100%);
            pointer-events: none;
            z-index: 2;
        }

        .pill-content {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px 0 32px;
            z-index: 10;
        }

        .left-group  { display: flex; align-items: center; gap: 26px; }
        .right-group { display: flex; align-items: center; gap: 20px; }

        .icon-btn {
            background: none; border: none; padding: 0;
            cursor: pointer; color: var(--icon-color);
            display: flex; align-items: center; justify-content: center;
            outline: none; transition: opacity 0.2s ease;
        }
        .icon-btn:hover { opacity: 0.72; }

        .icon-plus svg { width: 30px; height: 30px; }

        .text-ask {
            font-size: 30px;
            font-weight: 300;
            color: var(--text-color);
            letter-spacing: 0.2px;
            user-select: none;
            text-shadow: 0 0 20px rgba(140,230,210,0.18);
        }

        /* ── MIC ── */
        .mic-wrapper {
            position: relative;
            display: flex; align-items: center; justify-content: center;
            width: 60px; height: 60px;
        }

        .mic-halo {
            position: absolute;
            width: 115px; height: 115px;
            background: radial-gradient(circle,
                rgba(145,245,220,0.38) 0%,
                rgba(65,205,185,0.14) 32%,
                transparent 65%);
            border-radius: 50%;
            filter: blur(10px);
            pointer-events: none;
        }

        .mic-glow {
            position: absolute;
            width: 66px; height: 66px;
            background: radial-gradient(circle,
                var(--glow-core)  0%,
                var(--glow-mid)  36%,
                var(--glow-deep) 66%,
                transparent 84%);
            border-radius: 50%;
            filter: blur(1.5px);
            pointer-events: none;
        }

        .mic-core {
            position: absolute;
            width: 42px; height: 42px;
            background: radial-gradient(circle,
                rgba(215,255,245,0.60) 0%,
                rgba(110,235,215,0.28) 52%,
                transparent 78%);
            border-radius: 50%;
            pointer-events: none;
        }

        .icon-mic { position: relative; z-index: 2; color: #fff; }
        .icon-mic svg {
            width: 26px; height: 26px;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.55));
        }

        .icon-bars svg { width: 22px; height: 22px; }
    </style>
</head>
<body>

<!-- Background ambient sparkle canvas -->
<canvas id="bg-canvas"></canvas>

<div class="pill-wrapper">
    <!-- Pill sparkle ring canvas -->
    <canvas id="pill-canvas"></canvas>

    <div class="pill-rim"></div>
    <div class="pill-gloss"></div>

    <div class="pill-content">
        <div class="left-group">
            <button class="icon-btn icon-plus" aria-label="Add">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
                    <path d="M12 4v16M4 12h16"/>
                </svg>
            </button>
            <div class="text-ask">Ask Gemini</div>
        </div>

        <div class="right-group">
            <div class="mic-wrapper">
                <div class="mic-halo"></div>
                <div class="mic-glow"></div>
                <div class="mic-core"></div>
                <button class="icon-btn icon-mic" aria-label="Voice Input">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="3" width="6" height="11" rx="3"/>
                        <path d="M5 11v1a7 7 0 0 0 14 0v-1"/>
                        <path d="M12 19v3"/>
                    </svg>
                </button>
            </div>

            <button class="icon-btn icon-bars" aria-label="Audio Wave">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                    <path d="M7 10v4"/>
                    <path d="M12 6v12"/>
                    <path d="M17 10v4"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
// ─────────────────────────────────────────────
//  Draws a single Gemini 4-pointed sparkle star.
//  Deeply concave bezier curves between points.
// ─────────────────────────────────────────────
function drawSparkle(ctx, cx, cy, size) {
    const r  = size;
    const cp = size * 0.08;

    ctx.beginPath();
    ctx.moveTo(cx, cy - r);
    ctx.bezierCurveTo(cx + cp, cy - cp,  cx + cp, cy - cp,  cx + r, cy);
    ctx.bezierCurveTo(cx + cp, cy + cp,  cx + cp, cy + cp,  cx, cy + r);
    ctx.bezierCurveTo(cx - cp, cy + cp,  cx - cp, cy + cp,  cx - r, cy);
    ctx.bezierCurveTo(cx - cp, cy - cp,  cx - cp, cy - cp,  cx, cy - r);
    ctx.closePath();
    ctx.fill();
}

// ─────────────────────────────────────────────
//  Multi-frequency noise function (layered sines)
//  Returns a value between 0 and 1 that creates
//  organic, flowing wave bands across the pill.
// ─────────────────────────────────────────────
function waveNoise(x, y, W, H) {
    // Normalise coords
    const nx = x / W;
    const ny = y / H;

    // Multiple sine waves at different angles and frequencies
    // to create moiré-like flowing contours
    const w1 = Math.sin(nx * 28 + ny * 12) * 0.5 + 0.5;
    const w2 = Math.sin(nx * 15 - ny * 22 + 1.3) * 0.5 + 0.5;
    const w3 = Math.sin(nx * 8  + ny * 35 + 2.7) * 0.5 + 0.5;
    const w4 = Math.sin(nx * 42 + ny * 5  + 0.8) * 0.5 + 0.5;
    const w5 = Math.sin((nx + ny) * 20 + 3.1) * 0.5 + 0.5;
    const w6 = Math.sin((nx * 2 - ny * 1.5) * 18 + 4.2) * 0.5 + 0.5;

    // Blend with different weights — w1/w2 dominant, others add variation
    return (w1 * 0.30 + w2 * 0.25 + w3 * 0.18 + w4 * 0.12 + w5 * 0.08 + w6 * 0.07);
}

// ─────────────────────────────────────────────
//  PILL SPARKLE RING — with wavy flowing pattern
//
//  Instead of uniform opacity across the ring,
//  each sparkle's visibility is modulated by
//  multi-frequency waves. This creates flowing
//  bands where sparkles cluster and thin out,
//  giving the premium holographic/moiré quality.
// ─────────────────────────────────────────────
function drawPillSparkles() {
    const pill   = document.querySelector('.pill-wrapper');
    const canvas = document.getElementById('pill-canvas');
    const W = pill.offsetWidth;
    const H = pill.offsetHeight;
    const dpr = window.devicePixelRatio || 1;

    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const cx = W / 2;
    const cy = H / 2;
    const rx = W / 2 - 2;
    const ry = H / 2 - 2;

    const GRID = 3.5;  // Tight grid
    const SIZE = 1.4;  // Small stars

    // We'll draw in multiple passes grouped by blur level
    // so we can batch filter changes (expensive to switch per-sparkle).
    // Pass 0: sharp (outer edge), Pass 1: slight blur, Pass 2: heavy blur (inner edge dissolve)
    // Inner threshold pushed outward (0.42 -> 0.65) so the centre stays free.
    const passes = [
        { minD: 0.85, maxD: 1.2,  blur: 0   },   // Outer: crisp
        { minD: 0.75, maxD: 0.85, blur: 0.6 },   // Mid-ring: slightly soft
        { minD: 0.65, maxD: 0.75, blur: 1.4 },   // Inner edge: blurred/dissolved
    ];

    for (const pass of passes) {
        ctx.save();
        if (pass.blur > 0) {
            ctx.filter = `blur(${pass.blur}px)`;
        }

        for (let y = 0; y < H; y += GRID) {
            for (let x = 0; x < W; x += GRID) {
                const ox = (Math.floor(y / GRID) % 2 === 0) ? 0 : GRID / 2;
                const px = x + ox;
                const py = y;

                // Elliptical distance from centre
                const dx = (px - cx) / rx;
                const dy = (py - cy) / ry;
                const d  = Math.sqrt(dx * dx + dy * dy);

                // Only draw sparkles in this pass's distance band
                if (d < pass.minD || d >= pass.maxD) continue;

                // Ring alpha: fades from 0 at innermost to 1 at outermost
                const ringAlpha = Math.min(1, (d - 0.65) / 0.30);

                // Wave modulation — creates the flowing pattern
                const wave = waveNoise(px, py, W, H);
                const waveFactor = Math.pow(wave, 0.7);

                // Vertical lighting
                const vertFactor = 0.40 + 0.60 * (1 - (py / H));

                // Colour gradient: top = bright cyan-white, bottom = dim teal
                const topColor    = { r: 190, g: 252, b: 235 };
                const bottomColor = { r: 70,  g: 185, b: 162 };
                const t = py / H;
                const r = Math.round(topColor.r + (bottomColor.r - topColor.r) * t);
                const g = Math.round(topColor.g + (bottomColor.g - topColor.g) * t);
                const b = Math.round(topColor.b + (bottomColor.b - topColor.b) * t);

                const alpha = ringAlpha * waveFactor * vertFactor;
                if (alpha < 0.03) continue;

                // Vary size — inner blurred sparkles are slightly larger (bloom effect)
                const bloomScale = pass.blur > 0 ? 1.0 + pass.blur * 0.3 : 1.0;
                const sizeVar = SIZE * (0.8 + waveFactor * 0.4) * bloomScale;

                ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
                drawSparkle(ctx, px, py, sizeVar);
            }
        }

        ctx.restore();
    }
}

// ─────────────────────────────────────────────
//  BACKGROUND SPARKLE FIELD — also wavy
// ─────────────────────────────────────────────
function drawBgSparkles() {
    const canvas = document.getElementById('bg-canvas');
    const dpr = window.devicePixelRatio || 1;
    const W = window.innerWidth;
    const H = window.innerHeight;

    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const GRID = 8;
    const SIZE = 1.1;

    const focusX = W * 0.55;
    const focusY = H * 0.18;
    const spread = Math.min(W, H) * 0.42;

    for (let y = 0; y < H * 0.6; y += GRID) {
        for (let x = 0; x < W; x += GRID) {
            const ox = (Math.floor(y / GRID) % 2 === 0) ? 0 : GRID / 2;
            const px = x + ox;
            const py = y;

            const distFromFocus = Math.sqrt(
                Math.pow(px - focusX, 2) + Math.pow(py - focusY, 2)
            );
            const distAlpha = Math.max(0, 1 - distFromFocus / spread);

            // Wave pattern for background too
            const wave = waveNoise(px * 0.7, py * 0.7, W, H);

            const alpha = distAlpha * wave * 0.40;
            if (alpha < 0.02) continue;

            const sizeVar = SIZE * (0.7 + wave * 0.6);
            ctx.fillStyle = `rgba(88, 212, 188, ${alpha})`;
            drawSparkle(ctx, px, py, sizeVar);
        }
    }
}

// Draw both on load
window.addEventListener('load', () => {
    drawPillSparkles();
    drawBgSparkles();
});

// Redraw on resize
window.addEventListener('resize', () => {
    drawPillSparkles();
    drawBgSparkles();
});
</script>

</body>
</html>
