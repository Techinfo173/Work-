<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Gemini</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400&family=Inter:wght@300;400&display=swap');

        :root {
            --bg-page: #02080a;

            /* Pill body: vertical gradient gives 3D curvature (lit from above) */
            --pill-top:    #1a3a36;
            --pill-mid:    #0e2724;
            --pill-bottom: #04100e;

            --dot-bright: rgba(170, 250, 230, 1);
            --dot-mid:    rgba(110, 220, 200, 0.85);
            --dot-dim:    rgba(70, 180, 160, 0.5);

            --text-color: #f0faf8;
            --icon-color: #f4fbf9;

            --glow-core: #d4fbf0;
            --glow-mid:  #4ee0c8;
            --glow-deep: #128878;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-page);
            font-family: 'Google Sans', 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
        }

        /* Background halftone field - fills upper area like in screenshot */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle, rgba(80, 200, 180, 0.25) 0.8px, transparent 1.4px);
            background-size: 5.5px 5.5px;
            -webkit-mask-image:
                radial-gradient(ellipse 70% 55% at 60% 15%, black 0%, rgba(0,0,0,0.4) 50%, transparent 80%);
                    mask-image:
                radial-gradient(ellipse 70% 55% at 60% 15%, black 0%, rgba(0,0,0,0.4) 50%, transparent 80%);
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
        }

        /* Soft cyan ambient glow under the pill */
        body::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 700px;
            height: 200px;
            transform: translate(-50%, 30%);
            background: radial-gradient(ellipse 50% 50% at center,
                rgba(40, 180, 160, 0.18) 0%,
                rgba(20, 100, 90, 0.08) 40%,
                transparent 70%);
            filter: blur(20px);
            pointer-events: none;
            z-index: 0;
        }

        .pill-wrapper {
            position: relative;
            width: 560px;
            height: 100px;
            border-radius: 999px;
            /* Vertical curvature — lighter top, darker bottom = lit from above */
            background:
                linear-gradient(180deg,
                    var(--pill-top) 0%,
                    var(--pill-mid) 45%,
                    var(--pill-bottom) 100%);
            box-shadow:
                /* Drop shadow */
                0 30px 60px rgba(0, 0, 0, 0.85),
                0 10px 25px rgba(0, 0, 0, 0.6),
                /* Outer cyan ambient (tiny) */
                0 0 60px rgba(40, 180, 160, 0.08),
                /* Top highlight rim */
                inset 0 1px 0 rgba(180, 250, 230, 0.18),
                /* Bottom inner shadow for depth */
                inset 0 -8px 18px rgba(0, 0, 0, 0.55);
            overflow: hidden;
            z-index: 1;
        }

        /*
           HALFTONE — denser/brighter at top edge, fading down and inward.
           Two layers offset for organic stipple density.
           Mask: radial from center (transparent) → opaque at edges,
                 PLUS a vertical fade making top brighter than bottom.
        */
        .pill-texture {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at center, var(--dot-bright) 1.2px, transparent 1.7px),
                radial-gradient(circle at center, var(--dot-mid) 0.9px, transparent 1.4px),
                radial-gradient(circle at center, var(--dot-dim) 0.6px, transparent 1.1px);
            background-size: 4.5px 4.5px, 4.5px 4.5px, 4.5px 4.5px;
            background-position: 0 0, 2.25px 2.25px, 1.1px 3.3px;

            /* Edge ring mask */
            -webkit-mask-image:
                radial-gradient(ellipse 100% 145% at 50% 50%,
                    transparent 0%,
                    transparent 28%,
                    rgba(0,0,0,0.25) 48%,
                    rgba(0,0,0,0.7) 75%,
                    rgba(0,0,0,1) 95%);
                    mask-image:
                radial-gradient(ellipse 100% 145% at 50% 50%,
                    transparent 0%,
                    transparent 28%,
                    rgba(0,0,0,0.25) 48%,
                    rgba(0,0,0,0.7) 75%,
                    rgba(0,0,0,1) 95%);
        }

        /* Second pass: brightens the top half of the dot ring (the lit side) */
        .pill-texture-top {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at center, rgba(190, 255, 240, 0.9) 1px, transparent 1.6px);
            background-size: 4.5px 4.5px;
            background-position: 0 0;

            -webkit-mask-image:
                linear-gradient(180deg,
                    rgba(0,0,0,1) 0%,
                    rgba(0,0,0,0.6) 35%,
                    transparent 65%),
                radial-gradient(ellipse 100% 130% at 50% 50%,
                    transparent 35%,
                    rgba(0,0,0,1) 90%);
            -webkit-mask-composite: source-in;
                    mask-image:
                linear-gradient(180deg,
                    rgba(0,0,0,1) 0%,
                    rgba(0,0,0,0.6) 35%,
                    transparent 65%),
                radial-gradient(ellipse 100% 130% at 50% 50%,
                    transparent 35%,
                    rgba(0,0,0,1) 90%);
                    mask-composite: intersect;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        /* Inner cyan rim glow — soft turquoise halo just inside the edge */
        .pill-rim {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            box-shadow:
                inset 0 0 28px rgba(70, 220, 200, 0.18),
                inset 0 0 70px rgba(40, 160, 145, 0.10);
            pointer-events: none;
        }

        /* Subtle glassy top reflection */
        .pill-gloss {
            position: absolute;
            top: 0; left: 5%; right: 5%;
            height: 35%;
            border-radius: 999px 999px 50% 50% / 100% 100% 100% 100%;
            background: linear-gradient(180deg,
                rgba(255, 255, 255, 0.04) 0%,
                rgba(255, 255, 255, 0.01) 60%,
                transparent 100%);
            pointer-events: none;
        }

        .pill-content {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px 0 32px;
            z-index: 10;
        }

        .left-group {
            display: flex;
            align-items: center;
            gap: 26px;
        }

        .icon-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            color: var(--icon-color);
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: opacity 0.2s ease;
        }
        .icon-btn:hover { opacity: 0.75; }

        .icon-plus svg { width: 30px; height: 30px; }

        .text-ask {
            font-size: 30px;
            font-weight: 300;
            color: var(--text-color);
            letter-spacing: 0.2px;
            user-select: none;
            text-shadow: 0 0 18px rgba(150, 240, 220, 0.15);
        }

        .right-group {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .mic-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
        }

        /* Outermost soft bloom */
        .mic-halo {
            position: absolute;
            width: 110px;
            height: 110px;
            background: radial-gradient(circle,
                rgba(150, 245, 225, 0.35) 0%,
                rgba(70, 210, 190, 0.15) 30%,
                rgba(30, 130, 115, 0.05) 55%,
                transparent 70%);
            border-radius: 50%;
            filter: blur(10px);
            pointer-events: none;
        }

        /* Mid orb */
        .mic-glow {
            position: absolute;
            width: 64px;
            height: 64px;
            background: radial-gradient(circle,
                var(--glow-core) 0%,
                var(--glow-mid) 38%,
                var(--glow-deep) 68%,
                transparent 85%);
            border-radius: 50%;
            filter: blur(1.5px);
            pointer-events: none;
        }

        /* Sharp inner core for that "lit" look */
        .mic-core {
            position: absolute;
            width: 44px;
            height: 44px;
            background: radial-gradient(circle,
                rgba(220, 255, 245, 0.55) 0%,
                rgba(120, 240, 220, 0.3) 50%,
                transparent 80%);
            border-radius: 50%;
            pointer-events: none;
        }

        .icon-mic { position: relative; z-index: 2; color: #ffffff; }
        .icon-mic svg {
            width: 26px;
            height: 26px;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
        }

        .icon-bars svg { width: 22px; height: 22px; }
    </style>
</head>
<body>

    <div class="pill-wrapper">
        <!-- Halftone ring around perimeter -->
        <div class="pill-texture"></div>
        <!-- Brighter top dots (lit side) -->
        <div class="pill-texture-top"></div>
        <!-- Inner cyan rim glow -->
        <div class="pill-rim"></div>
        <!-- Top glass reflection -->
        <div class="pill-gloss"></div>

        <!-- UI -->
        <div class="pill-content">

            <div class="left-group">
                <button class="icon-btn icon-plus" aria-label="Add">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
                        <path d="M12 4v16M4 12h16" />
                    </svg>
                </button>
                <div class="text-ask">Ask Gemini</div>
            </div>

            <div class="right-group">
                <div class="mic-wrapper">
                    <div class="mic-halo"></div>
                    <div class="mic-glow"></div>
                    <div class="mic-core"></div>
                    <button class="icon-btn icon-mic" aria-label="Voice Input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="3" width="6" height="11" rx="3" />
                            <path d="M5 11v1a7 7 0 0 0 14 0v-1" />
                            <path d="M12 19v3" />
                        </svg>
                    </button>
                </div>

                <button class="icon-btn icon-bars" aria-label="Audio Wave Options">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                        <path d="M7 10v4" />
                        <path d="M12 6v12" />
                        <path d="M17 10v4" />
                    </svg>
                </button>
            </div>

        </div>
    </div>

</body>
</html>
