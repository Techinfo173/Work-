<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Gemini</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400&family=Inter:wght@300;400&display=swap');

        :root {
            --bg-page: #02080a;

            --pill-top:    #1a3a36;
            --pill-mid:    #0e2724;
            --pill-bottom: #04100e;

            --text-color: #f0faf8;
            --icon-color: #f4fbf9;

            --glow-core: #d4fbf0;
            --glow-mid:  #4ee0c8;
            --glow-deep: #128878;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-page);
            font-family: 'Google Sans', 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
        }

        /*
           GEMINI SPARKLE — 4-pointed concave star (the Gemini "spark" mark).
           Tiled as an SVG data URI background-image to create the perimeter starfield.
           The path uses Bezier curves to pinch the sides inward, giving the
           recognizable 4-point flare shape (top/right/bottom/left points,
           concave between them).
        */

        /* Ambient background sparkle field (faint, behind the pill) */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M6 0.5 C6 4 6 4 11.5 6 C6 8 6 8 6 11.5 C6 8 6 8 0.5 6 C6 4 6 4 6 0.5 Z' fill='%2358d4bc' opacity='0.5'/></svg>");
            background-size: 14px 14px;
            -webkit-mask-image:
                radial-gradient(ellipse 70% 55% at 60% 15%, black 0%, rgba(0,0,0,0.4) 50%, transparent 80%);
                    mask-image:
                radial-gradient(ellipse 70% 55% at 60% 15%, black 0%, rgba(0,0,0,0.4) 50%, transparent 80%);
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
        }

        /* Soft cyan ambient glow under the pill */
        body::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 700px;
            height: 200px;
            transform: translate(-50%, 30%);
            background: radial-gradient(ellipse 50% 50% at center,
                rgba(40, 180, 160, 0.18) 0%,
                rgba(20, 100, 90, 0.08) 40%,
                transparent 70%);
            filter: blur(20px);
            pointer-events: none;
            z-index: 0;
        }

        .pill-wrapper {
            position: relative;
            width: 560px;
            height: 100px;
            border-radius: 999px;
            background:
                linear-gradient(180deg,
                    var(--pill-top) 0%,
                    var(--pill-mid) 45%,
                    var(--pill-bottom) 100%);
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.85),
                0 10px 25px rgba(0, 0, 0, 0.6),
                0 0 60px rgba(40, 180, 160, 0.08),
                inset 0 1px 0 rgba(180, 250, 230, 0.18),
                inset 0 -8px 18px rgba(0, 0, 0, 0.55);
            overflow: hidden;
            z-index: 1;
        }

        /* BRIGHT SPARKLES — primary layer of Gemini stars on the pill */
        .sparkles-bright {
            position: absolute;
            inset: 0;
            background-image:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M6 0.5 C6 4 6 4 11.5 6 C6 8 6 8 6 11.5 C6 8 6 8 0.5 6 C6 4 6 4 6 0.5 Z' fill='%23baf7e3'/></svg>");
            background-size: 7px 7px;

            -webkit-mask-image:
                radial-gradient(ellipse 100% 145% at 50% 50%,
                    transparent 0%,
                    transparent 28%,
                    rgba(0,0,0,0.3) 50%,
                    rgba(0,0,0,0.85) 80%,
                    rgba(0,0,0,1) 100%);
                    mask-image:
                radial-gradient(ellipse 100% 145% at 50% 50%,
                    transparent 0%,
                    transparent 28%,
                    rgba(0,0,0,0.3) 50%,
                    rgba(0,0,0,0.85) 80%,
                    rgba(0,0,0,1) 100%);
            pointer-events: none;
        }

        /* DIM SPARKLES — offset second layer for organic stipple density */
        .sparkles-dim {
            position: absolute;
            inset: 0;
            background-image:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M6 1.5 C6 4.5 6 4.5 10.5 6 C6 7.5 6 7.5 6 10.5 C6 7.5 6 7.5 1.5 6 C6 4.5 6 4.5 6 1.5 Z' fill='%2370d4bc' opacity='0.7'/></svg>");
            background-size: 7px 7px;
            background-position: 3.5px 3.5px;

            -webkit-mask-image:
                radial-gradient(ellipse 100% 145% at 50% 50%,
                    transparent 0%,
                    transparent 28%,
                    rgba(0,0,0,0.3) 50%,
                    rgba(0,0,0,0.85) 80%,
                    rgba(0,0,0,1) 100%);
                    mask-image:
                radial-gradient(ellipse 100% 145% at 50% 50%,
                    transparent 0%,
                    transparent 28%,
                    rgba(0,0,0,0.3) 50%,
                    rgba(0,0,0,0.85) 80%,
                    rgba(0,0,0,1) 100%);
            pointer-events: none;
        }

        /* Top-half brightness boost — sparkles up top read brighter (lit side) */
        .sparkles-top-boost {
            position: absolute;
            inset: 0;
            background-image:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M6 0.5 C6 4 6 4 11.5 6 C6 8 6 8 6 11.5 C6 8 6 8 0.5 6 C6 4 6 4 6 0.5 Z' fill='%23e0fff5'/></svg>");
            background-size: 7px 7px;

            -webkit-mask-image:
                linear-gradient(180deg,
                    rgba(0,0,0,0.9) 0%,
                    rgba(0,0,0,0.4) 35%,
                    transparent 60%);
                    mask-image:
                linear-gradient(180deg,
                    rgba(0,0,0,0.9) 0%,
                    rgba(0,0,0,0.4) 35%,
                    transparent 60%);
            mix-blend-mode: screen;
            opacity: 0.6;
            pointer-events: none;
        }

        /* Inner cyan rim glow */
        .pill-rim {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            box-shadow:
                inset 0 0 28px rgba(70, 220, 200, 0.18),
                inset 0 0 70px rgba(40, 160, 145, 0.10);
            pointer-events: none;
        }

        /* Glassy top reflection */
        .pill-gloss {
            position: absolute;
            top: 0; left: 5%; right: 5%;
            height: 35%;
            background: linear-gradient(180deg,
                rgba(255, 255, 255, 0.04) 0%,
                rgba(255, 255, 255, 0.01) 60%,
                transparent 100%);
            pointer-events: none;
        }

        .pill-content {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px 0 32px;
            z-index: 10;
        }

        .left-group { display: flex; align-items: center; gap: 26px; }

        .icon-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            color: var(--icon-color);
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: opacity 0.2s ease;
        }
        .icon-btn:hover { opacity: 0.75; }

        .icon-plus svg { width: 30px; height: 30px; }

        .text-ask {
            font-size: 30px;
            font-weight: 300;
            color: var(--text-color);
            letter-spacing: 0.2px;
            user-select: none;
            text-shadow: 0 0 18px rgba(150, 240, 220, 0.15);
        }

        .right-group { display: flex; align-items: center; gap: 20px; }

        .mic-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
        }

        .mic-halo {
            position: absolute;
            width: 110px;
            height: 110px;
            background: radial-gradient(circle,
                rgba(150, 245, 225, 0.35) 0%,
                rgba(70, 210, 190, 0.15) 30%,
                rgba(30, 130, 115, 0.05) 55%,
                transparent 70%);
            border-radius: 50%;
            filter: blur(10px);
            pointer-events: none;
        }

        .mic-glow {
            position: absolute;
            width: 64px;
            height: 64px;
            background: radial-gradient(circle,
                var(--glow-core) 0%,
                var(--glow-mid) 38%,
                var(--glow-deep) 68%,
                transparent 85%);
            border-radius: 50%;
            filter: blur(1.5px);
            pointer-events: none;
        }

        .mic-core {
            position: absolute;
            width: 44px;
            height: 44px;
            background: radial-gradient(circle,
                rgba(220, 255, 245, 0.55) 0%,
                rgba(120, 240, 220, 0.3) 50%,
                transparent 80%);
            border-radius: 50%;
            pointer-events: none;
        }

        .icon-mic { position: relative; z-index: 2; color: #ffffff; }
        .icon-mic svg {
            width: 26px;
            height: 26px;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
        }

        .icon-bars svg { width: 22px; height: 22px; }
    </style>
</head>
<body>

    <div class="pill-wrapper">
        <!-- Gemini sparkle ring around perimeter -->
        <div class="sparkles-bright"></div>
        <div class="sparkles-dim"></div>
        <div class="sparkles-top-boost"></div>

        <!-- Inner cyan rim glow -->
        <div class="pill-rim"></div>
        <!-- Top glass reflection -->
        <div class="pill-gloss"></div>

        <!-- UI -->
        <div class="pill-content">

            <div class="left-group">
                <button class="icon-btn icon-plus" aria-label="Add">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
                        <path d="M12 4v16M4 12h16" />
                    </svg>
                </button>
                <div class="text-ask">Ask Gemini</div>
            </div>

            <div class="right-group">
                <div class="mic-wrapper">
                    <div class="mic-halo"></div>
                    <div class="mic-glow"></div>
                    <div class="mic-core"></div>
                    <button class="icon-btn icon-mic" aria-label="Voice Input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="3" width="6" height="11" rx="3" />
                            <path d="M5 11v1a7 7 0 0 0 14 0v-1" />
                            <path d="M12 19v3" />
                        </svg>
                    </button>
                </div>

                <button class="icon-btn icon-bars" aria-label="Audio Wave Options">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                        <path d="M7 10v4" />
                        <path d="M12 6v12" />
                        <path d="M17 10v4" />
                    </svg>
                </button>
            </div>

        </div>
    </div>

</body>
</html>
