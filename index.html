<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Gemini</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap');

        :root {
            --bg-page: #02080a;

            /* Pill body teal */
            --pill-edge: #0a1f1c;
            --pill-mid:  #102e2a;

            --dot-color: rgba(140, 240, 220, 0.95);
            --dot-color-dim: rgba(90, 200, 180, 0.55);

            --text-color: #e8f3f1;
            --icon-color: #f0f8f6;

            /* Mic */
            --glow-core: #b8f7e9;
            --glow-mid:  #3ddcc4;
            --glow-deep: #14a890;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-page);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
        }

        /* Background halftone wash (visible in screenshot's upper area) */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, rgba(80, 200, 180, 0.18) 0.7px, transparent 1.2px);
            background-size: 5px 5px;
            -webkit-mask-image: radial-gradient(ellipse 60% 50% at 55% 20%, black 0%, transparent 70%);
                    mask-image: radial-gradient(ellipse 60% 50% at 55% 20%, black 0%, transparent 70%);
            opacity: 0.55;
            pointer-events: none;
        }

        .pill-wrapper {
            position: relative;
            width: 540px;
            height: 96px;
            border-radius: 999px;
            /* Pill body: slightly lighter in the middle so it feels 3D */
            background:
                radial-gradient(ellipse 70% 130% at 50% 50%,
                    var(--pill-mid) 0%,
                    var(--pill-edge) 75%);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(120, 230, 215, 0.04),
                inset 0 1px 0 rgba(160, 240, 220, 0.05);
            overflow: hidden;
        }

        /*
           HALFTONE RING — the key visual.
           Dots cover the whole pill, but a mask makes them appear ONLY
           in a band around the perimeter, fading inward toward the center.
        */
        .pill-texture {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at center, var(--dot-color) 1.1px, transparent 1.6px),
                radial-gradient(circle at center, var(--dot-color-dim) 0.7px, transparent 1.2px);
            background-size: 4.5px 4.5px, 4.5px 4.5px;
            background-position: 0 0, 2.25px 2.25px;

            /* Inverse radial mask: opaque at edges, transparent at center.
               Ellipse sized to match the pill's wide aspect ratio so the
               band hugs all four sides + the curved ends evenly. */
            -webkit-mask-image:
                radial-gradient(ellipse 95% 140% at 50% 50%,
                    transparent 0%,
                    transparent 30%,
                    rgba(0, 0, 0, 0.35) 55%,
                    rgba(0, 0, 0, 0.85) 85%,
                    rgba(0, 0, 0, 1) 100%);
                    mask-image:
                radial-gradient(ellipse 95% 140% at 50% 50%,
                    transparent 0%,
                    transparent 30%,
                    rgba(0, 0, 0, 0.35) 55%,
                    rgba(0, 0, 0, 0.85) 85%,
                    rgba(0, 0, 0, 1) 100%);
        }

        /* Inner teal rim glow — the soft cyan halo just inside the pill edge */
        .pill-rim {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            box-shadow:
                inset 0 0 22px rgba(60, 200, 180, 0.20),
                inset 0 0 60px rgba(40, 160, 140, 0.10);
            pointer-events: none;
        }

        .pill-content {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px 0 30px;
            z-index: 10;
        }

        .left-group {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .icon-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            color: var(--icon-color);
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: opacity 0.2s ease;
        }
        .icon-btn:hover { opacity: 0.75; }

        .icon-plus svg { width: 28px; height: 28px; }

        .text-ask {
            font-size: 28px;
            font-weight: 300;
            color: var(--text-color);
            letter-spacing: 0.3px;
            user-select: none;
        }

        .right-group {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .mic-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
        }

        /* Outer halo — soft cyan bloom */
        .mic-halo {
            position: absolute;
            width: 96px;
            height: 96px;
            background: radial-gradient(circle,
                rgba(140, 240, 220, 0.30) 0%,
                rgba(60, 200, 180, 0.12) 35%,
                transparent 65%);
            border-radius: 50%;
            filter: blur(8px);
            pointer-events: none;
        }

        /* Inner glow orb — bright, saturated, tight falloff */
        .mic-glow {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle,
                var(--glow-core) 0%,
                var(--glow-mid) 35%,
                var(--glow-deep) 65%,
                transparent 82%);
            border-radius: 50%;
            filter: blur(1.5px);
            pointer-events: none;
        }

        .icon-mic { position: relative; z-index: 2; color: #ffffff; }
        .icon-mic svg { width: 26px; height: 26px; }

        .icon-bars svg { width: 22px; height: 22px; }
    </style>
</head>
<body>

    <div class="pill-wrapper">
        <!-- Halftone ring around perimeter -->
        <div class="pill-texture"></div>

        <!-- Inner cyan rim glow -->
        <div class="pill-rim"></div>

        <!-- UI -->
        <div class="pill-content">

            <div class="left-group">
                <button class="icon-btn icon-plus" aria-label="Add">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
                        <path d="M12 4v16M4 12h16" />
                    </svg>
                </button>
                <div class="text-ask">Ask Gemini</div>
            </div>

            <div class="right-group">
                <div class="mic-wrapper">
                    <div class="mic-halo"></div>
                    <div class="mic-glow"></div>
                    <button class="icon-btn icon-mic" aria-label="Voice Input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="3" width="6" height="11" rx="3" />
                            <path d="M5 11v1a7 7 0 0 0 14 0v-1" />
                            <path d="M12 19v3" />
                        </svg>
                    </button>
                </div>

                <button class="icon-btn icon-bars" aria-label="Audio Wave Options">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                        <path d="M7 10v4" />
                        <path d="M12 6v12" />
                        <path d="M17 10v4" />
                    </svg>
                </button>
            </div>

        </div>
    </div>

</body>
</html>
