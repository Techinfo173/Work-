<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Gemini</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap');

        :root {
            --bg-page: #010404;
            --pill-base: #051210;

            /* Halftone dot colors (visible, not sub-pixel) */
            --dot-color: rgba(120, 230, 215, 0.85);

            --text-color: #e2eeec;
            --icon-color: #ebf5f3;

            /* Mic glow - punchier, more saturated */
            --glow-center: #9ff7e6;
            --glow-mid: #3dd4bd;
            --glow-deep: #178877;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-page);
            background-image:
                radial-gradient(ellipse 70% 60% at 45% 35%, rgba(20, 60, 55, 0.18), transparent 70%),
                radial-gradient(circle at 75% 85%, rgba(8, 30, 25, 0.12), transparent 60%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .pill-wrapper {
            position: relative;
            width: 520px;
            height: 92px;
            border-radius: 999px;
            background-color: var(--pill-base);
            /* Subtle outer rim highlight + drop shadow */
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.75),
                0 0 0 1px rgba(80, 200, 180, 0.08),
                inset 0 0 0 1px rgba(120, 230, 215, 0.06);
            overflow: hidden;
        }

        /*
           HALFTONE LAYER
           - Real visible dots: 1.1px on a 4px grid
           - Two offset layers create a tighter, more organic stipple
           - Mask gradient fades the dots themselves (not a core overlay)
             from dense in the upper-left to invisible toward center/right.
        */
        .pill-texture {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at center, var(--dot-color) 1.1px, transparent 1.6px),
                radial-gradient(circle at center, rgba(120, 230, 215, 0.55) 0.8px, transparent 1.3px);
            background-size: 4px 4px, 4px 4px;
            background-position: 0 0, 2px 2px;

            /* Radial fade from upper-left so density drops in BOTH x and y */
            -webkit-mask-image:
                radial-gradient(ellipse 75% 110% at 0% 30%,
                    rgba(0, 0, 0, 1) 0%,
                    rgba(0, 0, 0, 0.95) 18%,
                    rgba(0, 0, 0, 0.55) 40%,
                    rgba(0, 0, 0, 0.18) 60%,
                    rgba(0, 0, 0, 0) 78%);
            mask-image:
                radial-gradient(ellipse 75% 110% at 0% 30%,
                    rgba(0, 0, 0, 1) 0%,
                    rgba(0, 0, 0, 0.95) 18%,
                    rgba(0, 0, 0, 0.55) 40%,
                    rgba(0, 0, 0, 0.18) 60%,
                    rgba(0, 0, 0, 0) 78%);
        }

        /* Faint teal wash that brightens the upper-left where dots are densest */
        .pill-glow-tl {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 55% 90% at 8% 30%,
                rgba(60, 200, 180, 0.18) 0%,
                rgba(40, 150, 135, 0.08) 35%,
                transparent 70%);
            pointer-events: none;
        }

        .pill-content {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 26px 0 28px;
            z-index: 10;
        }

        .left-group {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .icon-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            color: var(--icon-color);
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: opacity 0.2s ease;
        }

        .icon-btn:hover { opacity: 0.75; }

        .icon-plus svg { width: 26px; height: 26px; }

        .text-ask {
            font-size: 26px;
            font-weight: 300;
            color: var(--text-color);
            letter-spacing: 0.3px;
            user-select: none;
        }

        .right-group {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .mic-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
        }

        /* Punchier mic glow: saturated cyan with tighter falloff */
        .mic-glow {
            position: absolute;
            width: 62px;
            height: 62px;
            background: radial-gradient(circle,
                var(--glow-center) 0%,
                var(--glow-mid) 30%,
                var(--glow-deep) 58%,
                transparent 78%);
            border-radius: 50%;
            filter: blur(2.5px);
            opacity: 1;
            pointer-events: none;
        }

        /* Outer halo bloom around the mic */
        .mic-halo {
            position: absolute;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle,
                rgba(125, 240, 220, 0.25) 0%,
                rgba(60, 200, 180, 0.10) 35%,
                transparent 65%);
            border-radius: 50%;
            filter: blur(6px);
            pointer-events: none;
        }

        .icon-mic { position: relative; z-index: 2; color: #ffffff; }
        .icon-mic svg { width: 26px; height: 26px; }

        .icon-bars svg { width: 24px; height: 24px; }
    </style>
</head>
<body>

    <div class="pill-wrapper">
        <!-- Halftone dots -->
        <div class="pill-texture"></div>

        <!-- Soft teal wash in the upper-left -->
        <div class="pill-glow-tl"></div>

        <!-- UI -->
        <div class="pill-content">

            <div class="left-group">
                <button class="icon-btn icon-plus" aria-label="Add">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
                        <path d="M12 4v16M4 12h16" />
                    </svg>
                </button>
                <div class="text-ask">Ask Gemini</div>
            </div>

            <div class="right-group">
                <div class="mic-wrapper">
                    <div class="mic-halo"></div>
                    <div class="mic-glow"></div>
                    <button class="icon-btn icon-mic" aria-label="Voice Input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="3" width="6" height="11" rx="3" />
                            <path d="M5 11v1a7 7 0 0 0 14 0v-1" />
                            <path d="M12 19v3" />
                        </svg>
                    </button>
                </div>

                <!-- Bars: short / tall / short  (audio EQ look) -->
                <button class="icon-btn icon-bars" aria-label="Audio Wave Options">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                        <path d="M7 10v4" />
                        <path d="M12 6v12" />
                        <path d="M17 10v4" />
                    </svg>
                </button>
            </div>

        </div>
    </div>

</body>
</html>
